# Publishes both packages when a GitHub release is created: the npm package (@tvolden/block-code-editor) and the .NET
# library (BlockCodeEditor.Commands on nuget.org), with the same version. The version lives in package.json only; the
# release's tag must be v<that version>. Everything is tested and packed before either registry is touched.
#
# Secrets: npm_token (npm), NUGET_API_KEY (nuget.org).

name: Publish

on:
  release:
    types: [created]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the release tag against package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag '$TAG' doesn't match package.json's version (expected 'v$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: dotnet test -c Release dotnet/BlockCodeEditor.slnx
      - run: >-
          dotnet pack -c Release dotnet/BlockCodeEditor.Commands/BlockCodeEditor.Commands.csproj
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

  publish-nuget:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      # Pushes the .nupkg and, alongside it, its .snupkg. --skip-duplicate makes a re-run after a failure safe.
      - run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
