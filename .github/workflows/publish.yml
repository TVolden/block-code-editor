# Publishes both packages when a GitHub release is created: the npm package (@tvolden/block-code-editor) and the .NET
# library (BlockCodeEditor.Commands on nuget.org), with the same version. The version lives in package.json only; the
# release's tag must be v<that version>. Everything is tested and packed before either registry is touched.
#
# Both registries use Trusted Publishing (OIDC), not stored tokens. npmjs.com and nuget.org each trust this repository
# and this workflow file (publish.yml). Secret NUGET_USER is the nuget.org profile name.

name: Publish

on:
  release:
    types: [created]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the release tag against package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag '$TAG' doesn't match package.json's version (expected 'v$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: dotnet test -c Release dotnet/BlockCodeEditor.slnx
      - run: >-
          dotnet pack -c Release dotnet/BlockCodeEditor.Commands/BlockCodeEditor.Commands.csproj
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -o nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm publishes with (and signs provenance with)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # No token: npm authenticates with the OIDC token. Provenance is added automatically for a public repository.
      - run: npm publish --access public

  publish-nuget:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that nuget.org exchanges for a temporary API key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      # The temporary key is valid for an hour, so it is requested just before the push.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushes the .nupkg and, alongside it, its .snupkg. --skip-duplicate makes a re-run after a failure safe.
      - run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
